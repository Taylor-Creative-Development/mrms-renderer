[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrms-renderer"
version = "0.0.0"
description = "Open-source rendering and visualization of NOAA MRMS radar data."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Taylor Creative Development" }
]
dependencies = [
  "eccodes",
  "numpy",
  "Pillow",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
mrms-renderer = "mrms_renderer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
